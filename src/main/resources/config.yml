# Database Configuration
database:
  # Connection type: "mysql" (for MySQL/MariaDB) or "sqlite" (local file)
  type: mysql
  host: localhost
  port: 3306
  database: minecraft
  username: user
  password: password

  # If type is "sqlite", specify the filename here.
  sqlite-file: "player_data.db"

  # Redundancy System (JSON Exports)
  # WARNING: This simply copies database contents to the local filesystem.
  # This is NOT a true backup if stored on the same machine/container.
  # It is disabled by default to avoid misleading administrators.
  backups:
    enabled: false
    interval-hours: 24
    max-backups: 7
    path: "backups/"

  # =========================================================================
  # TRUE OFFSITE BACKUPS (RECOMMENDED)
  # =========================================================================
  # For production servers, we STRONGLY recommend using external database
  # management tools rather than the internal redundancy system above.
  #
  # Example (Linux/MySQL):
  #   mysqldump -u [user] -p[password] [database] [table] > backup.sql
  #
  # Best Practices:
  # 1. Automate: Use a cron job to run backups daily.
  # 2. Offsite: Use 'rclone' or 'aws s3 cp' to move the .sql file to cloud storage.
  # 3. Isolation: NEVER store true backups in the Minecraft server directory.
  # 4. Managed: Consider using AWS RDS, Google CloudSQL, or DigitalOcean Managed
  #    Databases for automatic point-in-time recovery.
  # =========================================================================

  # A list of JDBC properties to apply.
  # These are recommended, but you can change/add/remove as needed.
  properties:
    useSSL: false
    allowPublicKeyRetrieval: true

  # HikariCP Connection Pool Settings
  # These settings are optimized for resilience and performance.
  # It is recommended to leave these at their default values unless you are an experienced administrator.
  pool-settings:
    maximum-pool-size: 10
    minimum-idle: 10
    max-lifetime: 1800000 # 30 minutes
    connection-timeout: 5000 # 5 seconds
    idle-timeout: 600000 # 10 minutes

  # MySQL JDBC Optimizations
  # These are advanced settings for the MySQL driver.
  # Do not change these unless you know what you are doing.
  optimizations:
    cache-prep-stmts: true
    prep-stmt-cache-size: 250
    prep-stmt-cache-sql-limit: 2048
    use-server-prep-stmts: true
    use-local-session-state: true
    rewrite-batched-statements: true
    cache-result-set-metadata: true
    cache-server-configuration: true
    elide-set-auto-commits: true
    maintain-time-stats: false

# Set to true to enable verbose debugging messages in the server console.
# This can be useful for diagnosing issues, but should be false for normal operation.
debug: false

# A unique name for this server. This is CRITICAL for data locking.
# Each server connected to the same database MUST have a unique name.
# Example: "survival-1", "creative", "lobby"
server-id: "default-server"

# Set to prefix the player_data table (e.g., 'mc_data_bridge_').
table-prefix: ""

# The duration in milliseconds after which a player data lock is considered expired.
# This prevents players from being permanently locked out if a server crashes.
# Default: 60000 (1 minute)
lock-timeout: 60000

# The interval in seconds between lock updates (heartbeats) while a player is online.
# Default: 30
lock-heartbeat-seconds: 30

# Granular Data Synchronization Toggles
# Enable or disable synchronization for specific data components.
sync-data:
  health: true
  food-level: true
  experience: true
  inventory: true
  armor: true
  potion-effects: true
  ender-chest: false
  location: false
  advancements: false
  statistics: false
  pdc: false
  flight-gamemode: false

# Server/World Blacklist
# Data synchronization will be disabled for players on these servers or in these worlds.
sync-blacklist:
  servers:
    - "example-blacklisted-server"
  worlds:
    - "example_world_nether"

# Security Settings
security:
  # Log a warning if a player joins with a different UUID than previously recorded for that name.
  # This helps identify potential identity switches or "cracked-to-premium" transitions.
  log-uuid-mismatches: true
  
  # Verify SHA-256 checksums of player data before loading.
  # This prevents data manipulation or corruption from being synced.
  verify-data-integrity: true

# Identity & Migration Settings
identity:
  # PREMIUM: UUID for a name should NEVER change. Collisions require manual /migrate.
  # HYBRID: Allows flexible identity shifts (useful for Cracked -> Premium transitions).
  mode: PREMIUM

  # If true, and FastLogin is installed, the plugin will attempt to 
  # auto-migrate data if FastLogin confirms the player is a verified premium user.
  auto-migrate-fastlogin: false

  # If true, and AuthMe is installed, the plugin will attempt to 
  # auto-migrate data once the player successfully logs in via AuthMe.
  auto-migrate-authme: false

  # A secret seed used to salt all cryptographic hashes (Identity Hash and Checksums).
  # CHANGE THIS to a long, random string to secure your network.
  # WARNING: If you change this later, existing identity hashes will be updated on next join,
  # but data integrity checks will fall back to legacy mode until the data is re-saved.
  seed: "change-me-to-a-long-random-string"
